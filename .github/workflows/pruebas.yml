name: Pruebas

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probar-script:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Ejecutar la prueba de contar_errores
        run: bash pruebas/test_contar_errores.sh